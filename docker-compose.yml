name: estulanches

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: estulanches-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-estulanches}
      # Sem valor padrão: o compose se recusa a subir se DB_PASSWORD não estiver no .env
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      POSTGRES_DB: ${DB_NAME:-estulanches}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [backend]            # rede interna: sem acesso externo, sem porta publicada
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-estulanches} -d ${DB_NAME:-estulanches}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build: .
    image: estulanches-app:${APP_VERSION:-1.0.0}
    container_name: estulanches-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-estulanches}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      DB_NAME: ${DB_NAME:-estulanches}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    networks: [frontend, backend]
    init: true                     # encerra processos corretamente (PID 1)
    read_only: true                # sistema de arquivos do container somente leitura
    tmpfs: [/tmp]
    cap_drop: [ALL]                # remove todas as capabilities do Linux
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100
    logging: *logging

networks:
  frontend: {}
  backend:
    internal: true                 # sem rota para a internet

volumes:
  pgdata:
